name: Feature request
description: Suggest an idea for Explainer
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Explainer is deliberately small: boxes, text and lines. Ideas that keep it that way are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to explain or do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
