name: Bug report
description: Something in Explainer doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Draw a box
        2. ...
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 130 on macOS 15
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Board link (optional)
      description: A share link that shows the problem, if you have one.
